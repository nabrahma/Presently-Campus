<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      user-scalable=no is normally an accessibility mistake. Here the app is a
      fixed single-screen instrument with no reflowing text to enlarge, and
      pinch-zoom on a PWA reads as a broken web page rather than a feature.
      Text still scales with the system font-size setting.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>Presently Campus — Class Attendance</title>
    <meta
      name="description"
      content="Presently Campus takes class attendance by QR scan and shows every subject's standing to teachers and students."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus" />
    <!-- Draws the status bar over the app so the black canvas runs edge to edge. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#060806" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Presently Campus — Class Attendance" />
    <meta
      property="og:description"
      content="Scan in, see where you stand. QR attendance for teachers and students."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <style>
      /* Painted before the bundle loads so launching never flashes white. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #060806;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; color: #e7ede4; font-family: system-ui, sans-serif">
        <h1>JavaScript is required</h1>
        <p>Presently Campus needs JavaScript enabled to load attendance.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
